name: eeg_encoding
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  # 核心 Python 環境
  - python=3.7.11
  - pip

  # 深度學習 (PyTorch 1.10 + CUDA 11.3)
  - pytorch=1.10.1
  - torchvision=0.11.2
  - cudatoolkit=11.3.1

  # 科學運算核心
  - numpy=1.19.1
  - scipy=1.7.3
  - pandas=1.1.3
  - scikit-learn=0.23.2
  - statsmodels=0.12.0
  - h5py=3.3.0
  - matplotlib=3.4.3
  - pillow=8.0.0
  - imageio=2.13.1
  - joblib=0.17.0
  - numba=0.53.1
  - numexpr=2.7.3

  # 神經科學/醫學影像專用
  - mne=0.22.0
  - nibabel=3.2.1
  - nilearn=0.8.1
  - dipy=1.3.0
  - pysurfer=0.11.0

  # 3D 視覺化 (Mayavi 依賴體系)
  - vtk=8.2.0
  - mayavi=4.7.0
  - pyqt=5.9.2
  - traits=6.3.2
  - traitsui=7.2.0
  - pyface=7.3.0
  - envisage=6.0.1
  - apptools=5.1.0

  # IDE 與 Jupyter 工具
  - spyder=5.1.5
  - jupyter_core=4.6.3
  - jupyter_client=6.1.7
  - ipython=7.18.1
  - ipykernel=5.3.4
  - nbconvert=6.0.7
  - nbformat=5.0.8
  - notebook  # 建議加入此項以確保 Jupyter 能完整執行

  # 其他工具與相依套件
  - tqdm=4.62.3
  - pyyaml=5.3.1
  - requests=2.24.0
  - cython
  - mkl
  - mkl-service
  - cryptography
  - typing_extensions
  - zstd
  - ffmpeg

  # Windows 常用兼容套件
  - pywin32  # Windows 系統操作常需此套件

  # 通過 Pip 安裝的套件 (如果 Conda 找不到)
  - pip:
    - pyvista==0.33.0
    - scooby==0.5.11